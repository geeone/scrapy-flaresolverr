name: Build Status

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Status (Python ${{ matrix.python-version }}, ${{ matrix.scrapy-requirement }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported Scrapy
          - python-version: "3.10"
            scrapy-requirement: "Scrapy==2.12.*"
          - python-version: "3.11"
            scrapy-requirement: "Scrapy==2.12.*"
          - python-version: "3.12"
            scrapy-requirement: "Scrapy==2.12.*"

          # Latest supported Scrapy
          - python-version: "3.10"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.11"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.12"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.13"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.14"
            scrapy-requirement: "Scrapy<3"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.scrapy-requirement }}" "requests>=2.31,<3" build

      - name: Build the package
        run: python -m build

      - name: Install the package
        run: pip install dist/*.whl --no-deps

      - name: Check import
        run: python -c "import scrapy_flaresolverr"
