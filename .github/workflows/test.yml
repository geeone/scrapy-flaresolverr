name: Functional Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Functional Tests (Python ${{ matrix.python-version }}, ${{ matrix.scrapy-requirement }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported Scrapy
          - python-version: "3.10"
            scrapy-requirement: "Scrapy==2.12.*"
          - python-version: "3.11"
            scrapy-requirement: "Scrapy==2.12.*"
          - python-version: "3.12"
            scrapy-requirement: "Scrapy==2.12.*"

          # Latest supported Scrapy
          - python-version: "3.10"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.11"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.12"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.13"
            scrapy-requirement: "Scrapy<3"
          - python-version: "3.14"
            scrapy-requirement: "Scrapy<3"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.scrapy-requirement }}"
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=scrapy_flaresolverr --cov-report=xml tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14' && matrix.scrapy-requirement == 'Scrapy<3'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
